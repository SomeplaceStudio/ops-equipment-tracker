<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B1512">
<meta name="description" content="OPS 設備追蹤｜選品、確認、下訂到進場的設備清單管理">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OPS 設備">
<title>OPS 設備追蹤</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1B1512;         /* 頂部深色區 */
  --ink-2:#2A211C;
  --paper:#F3EDE3;       /* 頁面底 */
  --card:#FFFCF6;        /* 卡片 */
  --field:#F0E9DD;       /* 輸入／標籤底 */
  --text:#2A211C;
  --text-dim:#8A7A6C;
  --copper:#B0653F;
  --brass:#9A7A24;
  --sage:#5F7A52;
  --clay:#A44C3C;
  --line:rgba(42,33,28,.11);
  --line-d:rgba(243,237,227,.12);
  --r:13px;
  --wrap:1180px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);color:var(--text);
  font-family:"Noto Sans TC",system-ui,sans-serif;font-weight:300;
  font-size:15px;line-height:1.65;padding-bottom:100px;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.mono{font-family:"DM Mono",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:var(--wrap);margin:0 auto}

/* ── 深色頂部 ───────────────────── */
.top{
  background:var(--ink);color:#EFE7DC;
  padding:calc(env(safe-area-inset-top) + 22px) 18px 20px;
  border-radius:0 0 22px 22px;
}
.eyebrow{font-size:10px;letter-spacing:.28em;color:#C0754A;font-weight:500}
h1{font-family:"Noto Serif TC",serif;font-weight:500;font-size:26px;margin:5px 0 2px}
.sub{font-size:12px;color:#9A8B7F;margin-bottom:18px}
.gauge-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.gnum{font-family:"DM Mono",monospace;font-size:25px;color:#C9A24B;font-variant-numeric:tabular-nums}
.gnum small{font-size:11px;color:#9A8B7F;margin-left:5px}
.glabel{font-size:10px;letter-spacing:.16em;color:#9A8B7F}
.bar{height:7px;border-radius:4px;background:#3A2F28;display:flex;overflow:hidden}
.bar span{height:100%;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:10px;font-size:10.5px;color:#9A8B7F}
.legend i{width:7px;height:7px;border-radius:2px;display:inline-block;margin-right:5px}

/* ── 分區 ───────────────────────── */
.zones{display:flex;gap:7px;overflow-x:auto;padding:14px 18px 12px;scrollbar-width:none;
  max-width:var(--wrap);margin:0 auto}
.zones::-webkit-scrollbar{display:none}
.zone{
  flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  color:var(--text-dim);font-size:13px;white-space:nowrap;background:var(--card);
}
.zone .n{font-family:"DM Mono",monospace;font-size:10.5px;margin-left:6px;opacity:.6}
.zone[aria-selected="true"]{background:var(--copper);border-color:var(--copper);color:#FFFCF6;font-weight:400}

main{padding:0 14px}

/* ── 卡片 ───────────────────────── */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  margin-bottom:12px;display:flex;align-items:stretch;overflow:hidden;
  box-shadow:0 1px 2px rgba(42,33,28,.04);
}
.card.dragging{opacity:.45;box-shadow:0 10px 24px rgba(42,33,28,.18)}
.grip{
  flex:0 0 26px;background:var(--field);border-right:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  touch-action:none;cursor:grab;color:#B3A392;
}
.grip svg{width:11px;height:22px}
.body{flex:1;min-width:0;display:grid;grid-template-columns:1.12fr .88fr}
@media (max-width:399px){ .body{grid-template-columns:1fr} }

/* 左：產品 */
.prod{padding:12px;border-right:1px solid var(--line);min-width:0;display:flex;flex-direction:column}
@media (max-width:399px){ .prod{border-right:none;border-bottom:1px solid var(--line)} }
.photo{
  width:100%;aspect-ratio:4/3;border-radius:9px;background:var(--field);
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  margin-bottom:9px;font-size:10.5px;color:#B3A392;
}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.brand{font-size:9.5px;letter-spacing:.16em;color:var(--copper);font-weight:500}
.name{font-family:"Noto Serif TC",serif;font-weight:500;font-size:15.5px;line-height:1.35;margin:3px 0 7px;word-break:break-word}
.specs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.spec{font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--field);color:var(--text-dim)}
.price{font-family:"DM Mono",monospace;font-size:15px;color:var(--brass)}
.price s{color:#B3A392;font-size:10.5px;margin-left:5px}
.price small{font-size:10px;color:var(--text-dim);margin-left:5px}
.memo{font-size:11.5px;color:var(--text-dim);line-height:1.55;margin-top:7px}

/* 狀態 */
.stat{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.statsel{display:flex;align-items:center;gap:7px}
.dotmark{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
select.status{flex:1;background:transparent;border:none;font-size:13.5px;padding:2px 0;appearance:none;font-weight:400;cursor:pointer}
.chev{color:var(--text-dim);font-size:10px}
.tl{margin-top:7px;display:flex;flex-direction:column;gap:3px}
.tl div{font-size:10.5px;color:var(--text-dim);font-family:"DM Mono",monospace}
.tl b{font-family:"Noto Sans TC";font-weight:400;color:var(--text);margin-left:6px;font-size:11px}
.linkbtn{display:inline-block;align-self:flex-start;margin-top:8px;font-size:11px;color:var(--copper);
  border:1px solid var(--line);padding:3px 9px;border-radius:6px;text-decoration:none}

/* 卡片操作：編輯／刪除 */
.rowacts{display:flex;gap:6px;margin-top:auto;padding-top:10px}
.rowacts .chip{display:inline-flex;align-items:center;gap:4px}
.chip.edit{color:var(--copper);border-color:rgba(176,101,63,.35)}
.chip.del{color:var(--clay);border-color:rgba(164,76,60,.3)}
.chip.del:hover{background:var(--clay);border-color:var(--clay);color:#fff}
.chip.edit:hover{background:var(--copper);border-color:var(--copper);color:#fff}

/* 右：兩格意見 */
.replies{display:flex;flex-direction:column;min-width:0}
.reply{padding:11px 12px;flex:1;display:flex;flex-direction:column;min-width:0}
.reply + .reply{border-top:1px solid var(--line)}
.rhead{font-size:9.5px;letter-spacing:.14em;color:var(--text-dim);margin-bottom:6px;
  display:flex;align-items:center;gap:6px}
.rhead b{font-family:"Noto Sans TC";font-weight:500;font-size:11.5px;letter-spacing:.02em;color:var(--text)}
.flag{margin-left:auto;font-size:9.5px;padding:1px 7px;border-radius:999px;letter-spacing:.04em}
.flag.ok{background:rgba(95,122,82,.14);color:var(--sage)}
.flag.no{background:rgba(164,76,60,.13);color:var(--clay)}
.bubble{background:var(--field);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.55;flex:1;white-space:pre-wrap;word-break:break-word}
.bubble.empty{background:transparent;border:1px dashed var(--line);color:#B3A392;font-size:11.5px}
.stamp{display:block;font-size:9.5px;color:#B3A392;margin-top:5px;font-family:"DM Mono",monospace}
.acts{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.chip{font-size:11px;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim);
  background:transparent;transition:background .15s,color .15s,border-color .15s}
.chip:active{transform:scale(.95)}
.chip.ok[aria-pressed="true"]{background:var(--sage);border-color:var(--sage);color:#fff}
.chip.no[aria-pressed="true"]{background:var(--clay);border-color:var(--clay);color:#fff}
.chip.write{color:var(--copper);border-color:rgba(176,101,63,.35)}

.empty-zone{border:1px dashed var(--line);border-radius:var(--r);padding:34px 20px;
  text-align:center;color:var(--text-dim);font-size:13px;background:var(--card)}
.empty-zone b{display:block;font-family:"Noto Serif TC",serif;font-size:16px;color:var(--text);margin-bottom:5px}

/* ── 桌機：一排兩張卡 ─────────────── */
@media (min-width:900px){
  .top{padding-left:calc((100vw - min(100vw, var(--wrap)))/2 + 20px);
       padding-right:calc((100vw - min(100vw, var(--wrap)))/2 + 20px)}
  .zones{padding:16px 20px 14px}
  main{max-width:var(--wrap);margin:0 auto;padding:0 20px;
       display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .card{margin-bottom:0}
  .empty-zone{grid-column:1 / -1}
  .grip{cursor:grab}
}

/* ── 新增／編輯 ─────────────────── */
.fab{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(env(safe-area-inset-bottom) + 20px);
  background:var(--ink);color:#EFE7DC;font-size:14.5px;padding:14px 28px;
  border-radius:999px;box-shadow:0 8px 24px rgba(42,33,28,.28);z-index:40}
.scrim{position:fixed;inset:0;background:rgba(27,21,18,.5);z-index:50;opacity:0;
  pointer-events:none;transition:.25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);
  border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;
  padding:6px 18px calc(env(safe-area-inset-bottom) + 20px);
  transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translateY(0)}
@media (min-width:900px){
  .sheet{left:50%;right:auto;width:min(560px,92vw);bottom:24px;border-radius:18px;max-height:88vh;
    transform:translate(-50%,calc(100% + 40px));box-shadow:0 24px 60px rgba(27,21,18,.35)}
  .sheet.on{transform:translate(-50%,0)}
}
.grab{width:36px;height:4px;border-radius:2px;background:#D8CCBB;margin:8px auto 15px}
.sheet h2{font-family:"Noto Serif TC",serif;font-weight:500;font-size:19px;margin:0 0 4px}
.sheet .hint{font-size:12px;color:var(--text-dim);margin:0 0 16px}
label{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--text-dim);margin:0 0 5px}
.f{margin-bottom:12px}
input,select.sel,textarea{width:100%;background:var(--field);border:1px solid var(--line);
  border-radius:10px;padding:11px 12px;font-weight:300}
input:focus,select.sel:focus,textarea:focus{outline:2px solid var(--copper);outline-offset:-1px}
input::placeholder,textarea::placeholder{color:#B3A392}
textarea{resize:vertical;min-height:70px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{
  border:1.5px dashed rgba(176,101,63,.4);border-radius:12px;background:rgba(176,101,63,.05);
  padding:20px;text-align:center;color:var(--copper);font-size:13px;margin-bottom:14px;
  position:relative;overflow:hidden;min-height:96px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
}
.drop small{color:var(--text-dim);font-size:11px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.dropclear{position:absolute;top:7px;right:7px;z-index:3;width:26px;height:26px;border-radius:50%;
  background:rgba(27,21,18,.62);color:#FFFCF6;font-size:14px;line-height:1;
  display:flex;align-items:center;justify-content:center}
.dropclear[hidden]{display:none}
.parse{display:flex;gap:8px;align-items:center;justify-content:center;width:100%;
  background:var(--field);border:1px solid var(--line);color:var(--copper);
  border-radius:10px;padding:11px;font-size:13px;margin-bottom:15px}
.save{width:100%;background:var(--copper);color:#FFFCF6;border-radius:11px;padding:15px;font-size:15px;margin-top:4px}
.cancel{width:100%;padding:12px;color:var(--text-dim);font-size:13px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:13px;height:13px;border:2px solid rgba(176,101,63,.25);border-top-color:var(--copper);
  border-radius:50%;animation:spin .7s linear infinite}
.toast{position:fixed;left:50%;transform:translate(-50%,18px);
  bottom:calc(env(safe-area-inset-bottom) + 92px);background:var(--ink);color:#EFE7DC;
  font-size:13px;padding:10px 20px;border-radius:999px;z-index:80;opacity:0;
  pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="top">
  <div class="eyebrow">SOMEPLACE STUDIO</div>
  <h1>設備追蹤</h1>
  <div class="sub">永和・14.5 坪｜選品 → 設計師確認 → 夥伴確認 → 進場</div>
  <div class="gauge-top">
    <div><div class="gnum" id="gTotal">—<small>NT$</small></div><div class="glabel">目前累計金額</div></div>
    <div style="text-align:right"><div class="gnum" id="gCount" style="font-size:19px">—</div><div class="glabel">項設備</div></div>
  </div>
  <div class="bar" id="gBar"></div>
  <div class="legend" id="gLegend"></div>
</div>

<nav class="zones" id="zones" role="tablist"></nav>
<main id="list"></main>

<button class="fab" id="fab">＋ 新增設備</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grab"></div>
  <h2 id="sheetTitle">新增設備</h2>
  <p class="hint" id="sheetHint">照片會自動壓縮後存下來，不用先修圖。</p>

  <div class="drop" id="drop">
    <img id="prevImg" hidden alt="">
    <span id="dropText">＋ 加入照片</span>
    <small id="dropHint">拍照或從相簿選，自動壓縮</small>
    <input type="file" id="fPhoto" accept="image/*">
    <button class="dropclear" id="dropClear" type="button" title="移除照片" hidden>✕</button>
  </div>

  <div class="f"><label for="fUrl">商品連結</label>
    <input id="fUrl" type="url" inputmode="url" placeholder="https://..."></div>
  <button class="parse" id="btnParse">從連結帶入資料</button>

  <div class="f"><label for="fName">品名</label><input id="fName" placeholder="例：Enigma 425 吊燈"></div>
  <div class="two">
    <div class="f"><label for="fBrand">品牌</label><input id="fBrand" placeholder="Louis Poulsen"></div>
    <div class="f"><label for="fZone">分區</label><select class="sel" id="fZone"></select></div>
  </div>
  <div class="two">
    <div class="f"><label for="fPrice">價格 NT$</label><input id="fPrice" type="number" inputmode="numeric" placeholder="31065"></div>
    <div class="f"><label for="fQty">數量</label><input id="fQty" type="number" inputmode="numeric" value="1" min="1"></div>
  </div>
  <div class="two">
    <div class="f"><label for="fSize">尺寸</label><input id="fSize" placeholder="Ø42.2 × H74 cm"></div>
    <div class="f"><label for="fColor">顏色／材質</label><input id="fColor" placeholder="黃銅"></div>
  </div>
  <div class="f"><label for="fSpec">規格備註</label>
    <textarea id="fSpec" placeholder="電壓、管距、附件、交期⋯"></textarea></div>

  <button class="save" id="btnSave">加入清單</button>
  <button class="cancel" id="btnCancel">取消</button>
</section>

<div class="toast" id="toast"></div>

<script>
const ZONES=["接待區","攝影棚區","梳化間","廁所","辦公室"];
const STATUS=[
 {k:"待確認",c:"#B3A392"},{k:"已確認選用",c:"#9A7A24"},{k:"已下訂",c:"#B0653F"},
 {k:"已付款",c:"#7A5EA0"},{k:"已出貨",c:"#3F7F94"},{k:"已送達",c:"#5F7A52"},
 {k:"已安裝",c:"#41705C"},{k:"退回重選",c:"#A44C3C"}];
const sc=k=>(STATUS.find(s=>s.k===k)||STATUS[0]).c;
const KEY="ops:equip:v2";

let items=[], zone=ZONES[0];

const SEED=[
 {id:1,zone:"接待區",brand:"Louis Poulsen",name:"Enigma 425 吊燈",price:31065,list:38000,qty:1,
  size:"Ø42.2×H74cm",color:"霧白壓克力",spec:"E27／需預留天花吊點與調光迴路",url:"",img:"",
  status:"已付款",log:[{k:"已確認選用",at:"07/22"},{k:"已下訂",at:"07/26"},{k:"已付款",at:"07/28"}],
  d:{text:"吊點從吧台檯面往上 78cm，我改一版天花圖。",at:"07/28 14:20",v:"ok"},p:{text:"",at:"",v:""}},
 {id:2,zone:"攝影棚區",brand:"BulbSquare",name:"蘑菇落地燈",price:18900,list:null,qty:1,
  size:"H140cm",color:"綠／紅（未定）",spec:"實景區氛圍燈，顏色需與地毯一起看",url:"",img:"",
  status:"待確認",log:[],
  d:{text:"",at:"",v:""},p:{text:"紅色跟地毯會打架，投綠色一票。",at:"08/02 21:05",v:"no"}},
 {id:3,zone:"廁所",brand:"OVO 京典",name:"C3379 單體馬桶",price:10852,list:18500,qty:1,
  size:"管距 30cm",color:"白",spec:"管距須現場複測後才能下單",url:"",img:"",
  status:"已確認選用",log:[{k:"已確認選用",at:"08/05"}],
  d:{text:"拆除後我量一次管距再回你。",at:"08/05 10:11",v:"ok"},p:{text:"",at:"",v:""}}];

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return `${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")}`};
const stamp=()=>{const d=new Date();return `${today()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._);t._=setTimeout(()=>t.classList.remove("on"),1900)}

/* ── 儲存：瀏覽器 localStorage ────────────────── */
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const v=JSON.parse(raw); if(Array.isArray(v)){items=v;return}}
  }catch(e){console.warn("讀取失敗，改用預設清單",e)}
  items=SEED; save();
}
/* 回傳 true 代表寫入成功；localStorage 約 5MB，照片太多會滿 */
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(items));return true}
  catch(e){console.error(e);toast("瀏覽器儲存空間已滿，請先刪除幾筆含照片的設備");return false}
}

function drawGauge(){
  const total=items.reduce((a,i)=>a+(i.price||0)*(i.qty||1),0);
  $("#gTotal").innerHTML=total.toLocaleString()+'<small>NT$</small>';
  $("#gCount").textContent=items.length;
  const by={};items.forEach(i=>by[i.status]=(by[i.status]||0)+(i.price||0)*(i.qty||1));
  const on=total?STATUS.filter(s=>by[s.k]):[];
  $("#gBar").innerHTML=on.length?on.map(s=>`<span style="width:${by[s.k]/total*100}%;background:${s.c}"></span>`).join(""):'<span style="width:100%;background:#3A2F28"></span>';
  $("#gLegend").innerHTML=on.map(s=>`<div><i style="background:${s.c}"></i>${s.k} ${Math.round(by[s.k]/total*100)}%</div>`).join("");
}
function drawZones(){
  $("#zones").innerHTML=ZONES.map(z=>`<button class="zone" role="tab" aria-selected="${z===zone}" data-z="${z}">${z}<span class="n">${items.filter(i=>i.zone===z).length}</span></button>`).join("");
}
function replyBlock(it,role){
  const who=role==="d"?"設計師":"夥伴";
  const n=it[role]||{text:"",at:"",v:""};
  const flag=n.v==="ok"?'<span class="flag ok">已確認</span>':n.v==="no"?'<span class="flag no">需討論</span>':"";
  return `<div class="reply">
    <div class="rhead"><b>${who}</b>回覆${flag}</div>
    ${n.text?`<div class="bubble">${esc(n.text)}<span class="stamp">${n.at}</span></div>`:`<div class="bubble empty">尚未回覆</div>`}
    <div class="acts">
      <button class="chip ok" aria-pressed="${n.v==="ok"}" data-vote="ok" data-role="${role}" data-id="${it.id}">✓</button>
      <button class="chip no" aria-pressed="${n.v==="no"}" data-vote="no" data-role="${role}" data-id="${it.id}">需討論</button>
      <button class="chip write" data-write="${role}" data-id="${it.id}">${n.text?"編輯":"寫意見"}</button>
    </div></div>`;
}
function drawList(){
  const rows=items.filter(i=>i.zone===zone);
  if(!rows.length){$("#list").innerHTML=`<div class="empty-zone"><b>${zone}還沒有設備</b>按下方「新增設備」開始建檔。</div>`;return}
  $("#list").innerHTML=rows.map(it=>`
  <article class="card" data-id="${it.id}">
    <div class="grip" title="拖曳排序"><svg viewBox="0 0 11 22" fill="currentColor" aria-hidden="true"><circle cx="2.5" cy="4" r="1.6"/><circle cx="8.5" cy="4" r="1.6"/><circle cx="2.5" cy="11" r="1.6"/><circle cx="8.5" cy="11" r="1.6"/><circle cx="2.5" cy="18" r="1.6"/><circle cx="8.5" cy="18" r="1.6"/></svg></div>
    <div class="body">
      <div class="prod">
        <div class="photo">${it.img?`<img src="${esc(it.img)}" alt="${esc(it.name)}">`:"未加照片"}</div>
        <div class="brand">${esc(it.brand||"—")}</div>
        <div class="name">${esc(it.name)}</div>
        <div class="specs">
          ${it.size?`<span class="spec">${esc(it.size)}</span>`:""}
          ${it.color?`<span class="spec">${esc(it.color)}</span>`:""}
          ${it.qty>1?`<span class="spec">×${it.qty}</span>`:""}
        </div>
        <div class="price">${(it.price||0).toLocaleString()}${it.list?`<s>${it.list.toLocaleString()}</s>`:""}${it.qty>1?`<small>小計 ${((it.price||0)*it.qty).toLocaleString()}</small>`:""}</div>
        ${it.spec?`<div class="memo">${esc(it.spec)}</div>`:""}
        <div class="stat">
          <div class="statsel">
            <span class="dotmark" style="background:${sc(it.status)}"></span>
            <select class="status" data-id="${it.id}" style="color:${sc(it.status)}" aria-label="${esc(it.name)} 狀態">
              ${STATUS.map(s=>`<option ${s.k===it.status?"selected":""}>${s.k}</option>`).join("")}
            </select><span class="chev">▾</span>
          </div>
          ${(it.log||[]).length?`<div class="tl">${it.log.map(l=>`<div>${l.at}<b>${l.k}</b></div>`).join("")}</div>`:""}
        </div>
        ${it.url?`<a class="linkbtn" href="${esc(it.url)}" target="_blank" rel="noopener">商品頁 ↗</a>`:""}
        <div class="rowacts">
          <button class="chip edit" data-edit="${it.id}">編輯</button>
          <button class="chip del" data-del="${it.id}">刪除</button>
        </div>
      </div>
      <div class="replies">${replyBlock(it,"d")}${replyBlock(it,"p")}</div>
    </div>
  </article>`).join("");
}
const render=()=>{drawGauge();drawZones();drawList()};

/* ── 互動 ─────────────────────────────────── */
document.addEventListener("click",e=>{
  const z=e.target.closest("[data-z]");
  if(z){zone=z.dataset.z;render();return}

  const v=e.target.closest("[data-vote]");
  if(v){const it=items.find(i=>i.id==v.dataset.id);if(!it)return;
    const n=it[v.dataset.role]||={text:"",at:"",v:""};
    n.v=n.v===v.dataset.vote?"":v.dataset.vote;n.at=stamp();save();render();
    toast(n.v==="ok"?"已標記確認":n.v==="no"?"已標記需討論":"已取消標記");return}

  const w=e.target.closest("[data-write]");
  if(w){const it=items.find(i=>i.id==w.dataset.id);if(!it)return;
    const n=it[w.dataset.write]||={text:"",at:"",v:""};
    const t=prompt(`${w.dataset.write==="d"?"設計師":"夥伴"}意見`,n.text||"");
    if(t===null)return; n.text=t.trim();n.at=stamp();save();render();return}

  const ed=e.target.closest("[data-edit]");
  if(ed){openSheet(items.find(i=>i.id==ed.dataset.edit));return}

  const dl=e.target.closest("[data-del]");
  if(dl){
    const idx=items.findIndex(i=>i.id==dl.dataset.del); if(idx<0)return;
    const it=items[idx];
    if(!confirm(`刪除「${it.name}」？此動作無法復原。`))return;
    items.splice(idx,1); save(); render(); toast("已刪除");return}
});

document.addEventListener("change",e=>{
  if(e.target.matches("select.status")){
    const it=items.find(i=>i.id==e.target.dataset.id); if(!it)return;
    it.status=e.target.value;
    it.log=(it.log||[]).filter(l=>l.k!==it.status);
    it.log.push({k:it.status,at:today()});
    save();render();toast(`${today()} ${it.status}`);
  }
});

/* ── 拖曳排序 ─────────────────────────────── */
let dragEl=null;
document.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grip"); if(!g)return;
  dragEl=g.closest(".card"); dragEl.classList.add("dragging");
  dragEl.style.pointerEvents="none"; g.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove",e=>{
  if(!dragEl)return; e.preventDefault();
  const el=document.elementFromPoint(e.clientX,e.clientY);
  const over=el&&el.closest(".card");
  if(over&&over!==dragEl){
    const r=over.getBoundingClientRect();
    over.parentNode.insertBefore(dragEl, e.clientY<r.top+r.height/2?over:over.nextSibling);
  }
},{passive:false});
document.addEventListener("pointerup",()=>{
  if(!dragEl)return;
  dragEl.classList.remove("dragging"); dragEl.style.pointerEvents="";
  dragEl=null;
  const order=[...document.querySelectorAll(".card")].map(c=>+c.dataset.id);
  const inZone=items.filter(i=>i.zone===zone), rest=items.filter(i=>i.zone!==zone);
  items=[...rest,...order.map(id=>inZone.find(i=>i.id===id)).filter(Boolean)];
  save(); drawGauge();
});

/* ── 照片壓縮 ─────────────────────────────── */
let photoData="";      // 這次選的新照片
let photoCleared=false; // 編輯時按了移除

$("#fPhoto").onchange=function(){
  const f=this.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const M=1000, s=Math.min(1,M/Math.max(im.width,im.height));
    const c=document.createElement("canvas");
    c.width=Math.round(im.width*s); c.height=Math.round(im.height*s);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    photoData=c.toDataURL("image/jpeg",.82); photoCleared=false;
    showPhoto(photoData,`已壓縮 ${Math.round(photoData.length/1365)} KB・點擊可更換`);
  };im.onerror=()=>toast("這張圖讀不進來，換一張試試");im.src=r.result};
  r.onerror=()=>toast("檔案讀取失敗");
  r.readAsDataURL(f);
};
function showPhoto(src,hint){
  const p=$("#prevImg"); p.src=src; p.hidden=false;
  $("#dropText").textContent="";
  const h=$("#dropHint");
  h.textContent=hint; h.style.position="relative"; h.style.color="#FFFCF6";
  h.style.textShadow="0 1px 6px rgba(0,0,0,.7)";
  $("#dropClear").hidden=false;
}
function resetPhoto(){
  photoData="";photoCleared=false;
  $("#prevImg").hidden=true;$("#prevImg").removeAttribute("src");$("#fPhoto").value="";
  $("#dropText").textContent="＋ 加入照片";
  const h=$("#dropHint");h.textContent="拍照或從相簿選，自動壓縮";
  h.style.position="";h.style.color="";h.style.textShadow="";
  $("#dropClear").hidden=true;
}
$("#dropClear").onclick=e=>{e.stopPropagation();resetPhoto();photoCleared=true;toast("已移除照片")};

/* ── 面板：新增／編輯共用 ─────────────────── */
const sheet=$("#sheet"),scrim=$("#scrim");
let editId=null;

function openSheet(it){
  editId = it ? it.id : null;
  $("#fZone").innerHTML=ZONES.map(z=>`<option ${z===(it?it.zone:zone)?"selected":""}>${z}</option>`).join("");
  $("#sheetTitle").textContent = it ? "編輯設備" : "新增設備";
  $("#sheetHint").textContent  = it ? "改完按下方「儲存修改」。狀態與意見不會被覆蓋。" : "照片會自動壓縮後存下來，不用先修圖。";
  $("#btnSave").textContent    = it ? "儲存修改" : "加入清單";

  $("#fUrl").value  = it?.url   || "";
  $("#fName").value = it?.name  || "";
  $("#fBrand").value= it?.brand || "";
  $("#fPrice").value= it?.price ?? "";
  $("#fQty").value  = it?.qty   || 1;
  $("#fSize").value = it?.size  || "";
  $("#fColor").value= it?.color || "";
  $("#fSpec").value = it?.spec  || "";

  resetPhoto();
  if(it?.img) showPhoto(it.img,"點擊可更換照片");

  sheet.classList.add("on");scrim.classList.add("on");
  sheet.scrollTop=0;
}
const close=()=>{sheet.classList.remove("on");scrim.classList.remove("on");editId=null};

$("#fab").onclick=()=>openSheet(null);
$("#btnCancel").onclick=close;
scrim.onclick=close;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sheet.classList.contains("on"))close()});

$("#btnParse").onclick=function(){
  if(!$("#fUrl").value.trim()){toast("先貼上商品連結");return}
  this.disabled=true;this.innerHTML='<span class="spin"></span> 讀取商品頁⋯';
  setTimeout(()=>{this.disabled=false;this.textContent="從連結帶入資料";toast("這個站台擋抓取，請手動補齊")},1500);
};

$("#btnSave").onclick=()=>{
  const name=$("#fName").value.trim(); if(!name){toast("品名還沒填");return}
  const form={
    zone:$("#fZone").value, name,
    brand:$("#fBrand").value.trim(),
    price:+$("#fPrice").value||0,
    qty:+$("#fQty").value||1,
    size:$("#fSize").value.trim(),
    color:$("#fColor").value.trim(),
    spec:$("#fSpec").value.trim(),
    url:$("#fUrl").value.trim()
  };

  if(editId!==null){
    const it=items.find(i=>i.id===editId); if(!it){close();return}
    const backup=JSON.stringify(it);
    Object.assign(it,form);
    it.img = photoData ? photoData : (photoCleared ? "" : it.img);
    if(!save()){Object.assign(it,JSON.parse(backup));return}
    zone=form.zone; render(); close(); toast("已更新");
  }else{
    items.push({id:Date.now(),...form,list:null,img:photoData,
      status:"待確認",log:[],d:{text:"",at:"",v:""},p:{text:"",at:"",v:""}});
    if(!save()){items.pop();return}
    zone=form.zone; render(); close(); toast("已加入清單");
  }
  resetPhoto();
};

/* ── PWA ──────────────────────────────────── */
if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(e=>console.warn("SW 未註冊",e)));
}

load(); render();
</script>
</body>
</html>
